services:
  nginx:
    image: nginx:latest
    container_name: pr-nginx
    depends_on:
      - backend
    restart: no
    ports:
      - 8080:80
    volumes:
      - ./frontend:/etc/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  backend:
    container_name: pr-backend 
    build: ./backend
    restart: no
